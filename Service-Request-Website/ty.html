<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thank You | Abdul Basit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #191819, #2c2c2c);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thank-you-box {
            background-color: #f6f6f3;
            padding: 40px 30px;
            text-align: center;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .thank-you-box h1 {
            color: #191819;
            margin-bottom: 15px;
        }

        .thank-you-box p {
            color: #444;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .thank-you-box a {
            text-decoration: none;
            background-color: #562f23;
            color: #fff;
            padding: 12px 22px;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .thank-you-box a:hover {
            background-color: #3f221a;
        }

        .emoji {
            font-size: 40px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="thank-you-box">
        <div class="emoji">🙏</div>
        <h1>Thank You!</h1>
        <p>
            Thank you for choosing my services.  
            Your request has been successfully received, and I will get back to you as soon as possible.
        </p>
        <a href="index.html">Back to Home</a>
    </div>

</body>
</html>
